# =============================================================================
# [CI] FUSEAU - DEPLOIEMENT DE L'API SUR AZURE APP SERVICE
# =============================================================================
# Deploie uniquement l'application (API FastAPI plus frontend statique).
# L'ETL reste on-premise : classeur IMPORT sur le partage reseau, DWH Sylob
# on-premise, boite Gmail Achats. Il continue de tourner en tache planifiee.
#
# Authentification a Azure par OIDC (federation d'identite), sans secret de
# longue duree stocke dans GitHub. Les trois variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID et AZURE_SUBSCRIPTION_ID sont des secrets de depot.
#
# L'infrastructure n'est PAS appliquee ici : Terraform reste lance a la main
# apres relecture du plan (doctrine PROD, pas d'apply automatique sur la prod).
# =============================================================================

name: Deploiement FUSEAU (Azure App Service)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "frontend/**"
      - "requirements.txt"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploiement-fuseau-prod
  cancel-in-progress: false

env:
  NOM_WEBAPP: app-shsv-fuseau-prod
  GROUPE_RESSOURCES: rg-shsv-fuseau-prod
  VERSION_PYTHON: "3.11"

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSION_PYTHON }}

      - name: Verifier que le code demarre
        # Garde-fou minimal : un import qui casse doit echouer ici, pas en prod
        # cinq minutes plus tard sur un conteneur qui redemarre en boucle.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('app').rglob('*.py')]"
          AUTH_MODE=entra python -c "from app.main import app; print('[SUCCES] Application importee :', app.title)"

      - name: Se connecter a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construire le paquet de deploiement
        # On n'envoie que ce que l'application sert : ni ETL Excel, ni scripts
        # de deploiement du poste metier, ni donnees.
        run: |
          zip -r paquet.zip app src frontend requirements.txt \
            -x "src/scripts/etl/*" -x "*__pycache__*" -x "*.pyc"

      - name: Deployer sur la Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.NOM_WEBAPP }}
          package: paquet.zip

      - name: Estampiller la version deployee
        # Pose le SHA du commit dans les app settings. Deux effets, tous deux
        # voulus : l'application peut declarer ce qu'elle sert, et la
        # modification d'un app setting provoque le recyclage du conteneur.
        #
        # Ce recyclage n'est pas garanti par le deploiement lui-meme. Constate
        # le 22/09/2026 : un paquet marque actif a 13:54 n'avait pas recycle le
        # conteneur, qui a continue de servir le code du matin pendant que le
        # controle de sante repondait 200. L'etape suivante ne fait donc pas
        # confiance a ce recyclage, elle le verifie.
        run: |
          az webapp config appsettings set \
            --resource-group "${GROUPE_RESSOURCES}" \
            --name "${NOM_WEBAPP}" \
            --settings FUSEAU_COMMIT="${GITHUB_SHA}" \
            --output none
          echo "Version estampillee : ${GITHUB_SHA}"

      - name: Verifier la sante apres deploiement
        # Trois controles, dans cet ordre :
        #   1. /api/health repond 200 : l'application tourne et joint la base privee.
        #   2. le commit qu'elle declare est celui qu'on vient de deployer.
        #   3. la racine est protegee par Entra ID.
        #
        # Le point 2 est le plus important, et c'est celui qui manquait. Sans
        # lui, le controle valide n'importe quelle version en cours d'execution :
        # le 22/09/2026, le conteneur n'ayant pas ete recycle, il a repondu 200
        # avec le code de la veille et le pipeline est passe au vert sur une
        # livraison sans effet. Un pipeline vert a tort est plus couteux qu'un
        # pipeline rouge a tort, parce que personne ne va verifier derriere.
        run: |
          attendu="${GITHUB_SHA}"
          url="https://${NOM_WEBAPP}.azurewebsites.net/api/health"

          # Interroge la sonde et renvoie le commit declare, ou une chaine vide.
          commit_servi() {
            curl -s --max-time 20 "${url}" 2>/dev/null \
              | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          }

          # Le conteneur met du temps a repartir : tirage de l'image, activation
          # de l'environnement Oryx, sonde de demarrage. Mesure du 22/09 : 4 min 30
          # au total, dont 51 s de sonde seule. On laisse 8 minutes.
          attendre_le_bon_commit() {
            for tentative in $(seq 1 32); do
              obtenu="$(commit_servi)"
              if [ "${obtenu}" = "${attendu}" ]; then
                echo "[SUCCES] Version servie conforme (${obtenu}), tentative ${tentative}."
                return 0
              fi
              echo "  tentative ${tentative}/32 : servi='${obtenu:-aucune reponse}'"
              sleep 15
            done
            return 1
          }

          echo "Attente du recyclage du conteneur, 8 minutes au plus..."
          if ! attendre_le_bon_commit; then
            # Repli : le recyclage declenche par l'app setting n'a pas eu lieu.
            # On force un redemarrage, une seule fois. Il n'est volontairement
            # pas systematique : il coute environ 2 min 30 d'indisponibilite,
            # mesurees le 22/09.
            echo "[ATTENTION] Version attendue non servie. Redemarrage force de la Web App."
            az webapp restart \
              --resource-group "${GROUPE_RESSOURCES}" \
              --name "${NOM_WEBAPP}" \
              --output none

            if ! attendre_le_bon_commit; then
              echo "[ECHEC] Apres redemarrage, l'application ne sert toujours pas ${attendu}."
              echo "        Derniere valeur observee : '$(commit_servi)'."
              exit 1
            fi
          fi

          # Controle de protection : la racine ne doit jamais repondre 200 a un
          # appel anonyme.
          racine=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                   "https://${NOM_WEBAPP}.azurewebsites.net/")
          echo "Racine anonyme : ${racine}"
          case "${racine}" in
            302|401|403) echo "[SUCCES] Application en ligne et protegee par Entra ID." ;;
            200) echo "[ECHEC] Interface accessible sans authentification." && exit 1 ;;
            *) echo "[ECHEC] Reponse inattendue : ${racine}" && exit 1 ;;
          esac